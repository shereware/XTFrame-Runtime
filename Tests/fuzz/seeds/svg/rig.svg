        stroke="#112244" stroke-width="2" xt-skin="Skel" bind:opacity="0.5">
    <xt-weights bones="A B">0 0:1
1 0:.5 1:.5
2 1:1
3 1:1
4 0:.5 1:.5
5 0:1</xt-weights>
  </path>
  <xt-skeleton id="Skel">
    <xt-bone id="A" length="60" translate="60 140">
      <xt-bone id="B" length="60">
        <xt-constraint kind="ik" target="#Hand"/>
