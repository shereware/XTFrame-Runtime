<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- T-661 (10 section 10.11 item 3): strokes that are not drawn as direct convex fans (polylines,
       closed outlines, joins and caps, dashes whose pieces touch), which the GPU backends draw from
       the coverage atlas at 1x. -->

  <!-- Row 1: 2 px polylines with a sharp miter, a round join and a bevel; a closed rounded
       rectangle outline 1.5 px wide. -->
  <polyline points="10,60 30,14 50,60" fill="none" stroke="#1f3a93" stroke-width="2"
            stroke-linejoin="miter" stroke-miterlimit="10"/>
  <polyline points="64,60 84,14 104,60 114,30" fill="none" stroke="#b03a2e" stroke-width="2"
            stroke-linejoin="round"/>
  <polyline points="128,60 148,14 168,60 178,30" fill="none" stroke="#117a65" stroke-width="2"
            stroke-linejoin="bevel"/>
  <rect x="190.5" y="14.5" width="56" height="46" rx="10" fill="none" stroke="#6c3483"
        stroke-width="1.5"/>

  <!-- Row 2: 0.5 px and 0.25 px polylines (they must stay continuous, alpha following the width);
       a dashed polyline rotated 13 degrees whose round-capped dashes touch. -->
  <polyline points="10,130 40,84 70,130 100,90" fill="none" stroke="#000000" stroke-width="0.5"/>
  <polyline points="110,130 140,84 170,130 200,90" fill="none" stroke="#000000" stroke-width="0.25"/>
  <g transform="rotate(13 222 110)">
    <polyline points="208,135 218,88 240,135" fill="none" stroke="#ca6f1e" stroke-width="3"
              stroke-dasharray="8 2" stroke-linecap="round"/>
  </g>

  <!-- Row 3: a stroked icon (a heart outline with curves, round joins; a round-capped check mark). -->
  <path d="M40 172 C 40 156, 12 156, 12 176 C 12 194, 34 206, 40 216 C 46 206, 68 194, 68 176
           C 68 156, 40 156, 40 172 Z"
        fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M90 190 L105 206 L136 168" fill="none" stroke="#1e8449" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Row 4: a 1 px slanted polyline about 2450 px long (mostly off the image): its coverage bitmap
       is wider than 512 px, so it is tiled. -->
  <polyline points="-2200,240 120,250 250,244" fill="none" stroke="#2e4053" stroke-width="1"/>
</svg>
