name: CI

# Runtime build and tests on every push and pull request. Generated by tools/export_runtime.sh in
# the XTFrame main repository (template tools/export/templates/ci.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset vs2022
      - name: Build Debug
        run: cmake --build --preset vs2022-debug
      - name: Test Debug
        run: ctest --preset vs2022-debug --output-on-failure
      - name: Build Release
        run: cmake --build --preset vs2022-release
      - name: Test Release
        run: ctest --preset vs2022-release --output-on-failure

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: g++-12, cxx: g++-12 }
          - { pkg: clang-15, cxx: clang++-15 }
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.pkg }} \
            libgl1-mesa-dev libglu1-mesa-dev xvfb libx11-dev libxext-dev
      - name: Configure Debug
        run: cmake --preset ninja-ci-debug
      - name: Build Debug
        run: cmake --build --preset ninja-ci-debug
      - name: Test Debug
        run: xvfb-run -a ctest --preset ninja-ci-debug --output-on-failure
      - name: Configure Release
        run: cmake --preset ninja-ci-release
      - name: Build Release
        run: cmake --build --preset ninja-ci-release
      - name: Test Release
        run: xvfb-run -a ctest --preset ninja-ci-release --output-on-failure

  macos:
    runs-on: macos-latest
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: brew install ninja
      - name: Configure Debug
        run: cmake --preset ninja-ci-debug
      - name: Build Debug
        run: cmake --build --preset ninja-ci-debug
      - name: Test Debug
        run: ctest --preset ninja-ci-debug --output-on-failure
      - name: Configure Release
        run: cmake --preset ninja-ci-release
      - name: Build Release
        run: cmake --build --preset ninja-ci-release
      - name: Test Release
        run: ctest --preset ninja-ci-release --output-on-failure
