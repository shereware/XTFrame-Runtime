<style>
body { margin: 0; background: #030504 }
.rule { position: absolute; height: 1px; background: linear-gradient(90deg, #9fbf9f00 0%, #9fbf9fb3 20%, #9fbf9fb3 80%, #9fbf9f00 100%) }
.row { position: absolute; left: 0px; width: 420px; height: 40px; transform: translateX(0px) translateZ(0px);
       transition: transform 280ms cubic-bezier(.2,.8,.2,1) }
.hl { position: absolute; left: 18px; top: 2px; width: 390px; height: 36px; opacity: 0;
      background: linear-gradient(90deg, #f5b91e55 0%, #f5b91e1c 45%, #f5b91e00 100%);
      border-top: 1px solid #f5d27a66; transition: opacity 220ms ease-out }
.hl.on { opacity: 1; box-shadow: 0 0 18px 0 #f5b91e44 }
.star { position: absolute; left: 10px; top: 9px; width: 20px; height: 20px; opacity: 0; transition: opacity 220ms ease-out }
.star.on { opacity: 1 }
.diff-item { position: absolute; top: 2px; width: 340px; height: 36px; padding: 0px; margin: 0px;
             background-color: #00000000; border: 0px solid #00000000;
             text-align: left; line-height: 36px; font-size: 21px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
             color: #cfe3c6; text-shadow: 0 0 8px #7fbf8a66; transition: all 200ms ease-out }
.diff-item:hover { color: #ffffff }
.diff-item.on { font-size: 25px; color: #f5b91e }
.frame-swap { animation: frame-b 560ms cubic-bezier(.2,.8,.2,1) 0s 1 normal both }
.frame-swap.flip { animation: frame-a 560ms cubic-bezier(.2,.8,.2,1) 0s 1 normal both }
.text-swap { animation: text-b 420ms cubic-bezier(.2,.8,.2,1) 0s 1 normal both }
.text-swap.flip { animation: text-a 420ms cubic-bezier(.2,.8,.2,1) 0s 1 normal both }
.hint-swap { animation: hint-b 420ms ease-out 0s 1 normal both }
.hint-swap.flip { animation: hint-a 420ms ease-out 0s 1 normal both }
.frame-z { transform: translateZ(45px) rotateX(0deg); transition: transform 320ms ease-out }
.frame-z.pop { transform: translateZ(130px) rotateX(-14deg) }
.corner { pointer-events: none; position: absolute; width: 26px; height: 26px; transform: translateZ(100px);
          filter: drop-shadow(0 0 6px #6fff9f); animation: corner-pulse 1800ms ease-in-out 0s infinite alternate }
.mote { position: absolute; width: 10px; height: 10px; border-radius: 5px;
        background: radial-gradient(circle, #d8ffe8cc 0%, #9fdcb800 70%) }
@keyframes drift {
  from { transform: scale(1.04) translateX(-12px) translateY(0px); }
  to   { transform: scale(1.04) translateX(12px) translateY(-8px); }
}
@keyframes shaft {
  from { opacity: 0.3; }
  to   { opacity: 0.85; }
}
@keyframes float {
  from { transform: translateY(0px) translateX(0px); opacity: 0.25; }
  to   { transform: translateY(-60px) translateX(14px); opacity: 0.9; }
}
@keyframes drip {
  from { transform: translateY(-120px); opacity: 0; }
  to   { transform: translateY(760px); opacity: 0.9; }
}
@keyframes list-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes panel-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes frame-a {
  from { opacity: 0.1; }
  to   { opacity: 1; }
}
@keyframes frame-b {
  from { opacity: 0.1; }
  to   { opacity: 1; }
}
@keyframes text-a {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes text-b {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes hint-a {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes hint-b {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes scan {
  from { transform: translateY(-50px); }
  to   { transform: translateY(200px); }
}
@keyframes corner-pulse {
  from { opacity: 0.45; }
  to   { opacity: 1; }
}
@keyframes glow-pulse {
  from { opacity: 0.4; }
  to   { opacity: 0.9; }
}
@keyframes flicker {
  0%   { opacity: 0.9; }
  45%  { opacity: 0.75; }
  50%  { opacity: 0.35; }
  55%  { opacity: 0.85; }
  100% { opacity: 0.95; }
}
@keyframes boot-sweep {
  from { transform: translateY(-20px); opacity: 1; }
  to   { transform: translateY(740px); opacity: 0; }
}
@keyframes hud-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes blink {
  from { opacity: 0.25; }
  to   { opacity: 1; }
}
</style>
