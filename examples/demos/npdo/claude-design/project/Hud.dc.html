<!doctype html>
<html><head><meta charset="utf-8"><title>In-game HUD</title></head>
<body><x-dc>
<helmet><style>
  body { margin: 0; background: #050505 }
  .vital { position: relative; width: 450px; height: 51px; flex-shrink: 0 }
  .vital-icon { position: absolute; left: 0px; top: 10.5px; width: 30px; height: 30px }
  .vital-label { position: absolute; left: 51px; top: 0px; height: 51px; line-height: 51px; white-space: nowrap;
                 font-size: 16.5px; letter-spacing: 3px; text-transform: uppercase; color: #d6d0c2 }
  .bar-track { position: absolute; left: 168px; top: 21px; width: 180px; height: 9px; overflow: hidden;
               background-color: #ffffff1a; border: 1.5px solid #ffffff26 }
  .bar-fill { position: absolute; left: 0px; top: 0px; height: 6px; background-color: #e8e2d4 }
  .gone { display: none }
  .slot { position: relative; width: 93px; height: 105px; flex-shrink: 0;
          border: 1.5px solid #ffffff40; background-color: #0000008c }
  .slot.active { border: 3px solid #efe8d8; background-color: #ffffff1a }
  .slot-badge { position: absolute; left: 4.5px; top: 4.5px; width: 21px; height: 21px; line-height: 18px;
                text-align: center; font-size: 15px; color: #e8e2d4; border: 1.5px solid #e8e2d499 }
  .active .slot-badge { background-color: #efe8d8; color: #0a0a0a }
  .slot-icon { position: absolute; left: 19.5px; top: 28.5px; width: 54px; height: 54px }
  .slot-caption { position: absolute; left: -18px; top: 114px; width: 129px; height: 24px; line-height: 24px;
                  text-align: center; white-space: nowrap; font-size: 16.5px; letter-spacing: 0.75px; color: #d6d0c2 }
</style></helmet>
<!-- Board 1920x1080 (spec x1.5). Safe area 2.5 % = 48 px left/right, 27 px top/bottom. Transparent in game. -->
<div id="hud" style="position: relative; z-index: 1; width: 1920px; height: 1080px; overflow: hidden; background-color: #00000000;
     font-family: Georgia, 'Times New Roman', serif; color: #e8e2d4;"
     data-xt-port="objective:string in = &quot;Reach the Main Entrance&quot;; location:string in = &quot;St. Ren Hospital Grounds&quot;; clock:string in = &quot;17:42&quot;; hp:number in = 64; stamina:number in = 78; noise_label:string in = &quot;Low&quot;; interact_label:string in = &quot;Open Gate&quot;; interact_visible:bool in = true; active:bool in = true"
     data-xt-trigger="port(active):if eq(1) show() else hide(); if eq(1) play(intro)">

  <img id="hud-preview-bg" src="/_blob/hud-preview-bg.png" alt="" data-xt-editor-only
       style="position: absolute; left: 0%; top: 0%; width: 100%; height: 100%; object-fit: cover;">
  <div id="hud-vignette" data-xt-editor-only style="position: absolute; left: 0%; top: 0%; width: 100%; height: 100%;
       background: radial-gradient(ellipse farthest-corner at 50% 50%, #00000000 55%, #00000099 100%);"></div>

  <div id="objective" style="position: absolute; left: 108px; top: 78px; width: 420px; height: 78px;"
       data-xt-timeline="intro: 0 opacity 0, 800 ease-out opacity 1">
    <div id="objective-rule" style="position: absolute; left: 0px; top: 0px; width: 3px; height: 78px; background-color: #efe8d8;"></div>
    <span id="objective-label" style="position: absolute; left: 24px; top: 0px; height: 33px; line-height: 33px; white-space: nowrap;
          font-size: 21px; letter-spacing: 3px; color: #d6d0c2;">Objective:</span>
    <div id="objective-line" style="position: absolute; left: 24px; top: 37.5px; width: 330px; height: 1.5px; background-color: #ffffff33;"></div>
    <span id="objective-text" style="position: absolute; left: 24px; top: 42px; height: 36px; line-height: 36px; white-space: nowrap;
          font-size: 24px; letter-spacing: 2.25px; color: #f6f1e6;" data-xt-bind="text=objective">Reach the Main Entrance</span>
  </div>

  <div id="location" style="position: absolute; left: 1434px; top: 78px; width: 390px; height: 73.5px;
       display: flex; flex-direction: column; align-items: flex-end;"
       data-xt-timeline="intro: 0 opacity 0, 200 opacity 0, 1000 ease-out opacity 1">
    <span id="location-name" style="height: 33px; line-height: 33px; white-space: nowrap; font-size: 21px; letter-spacing: 2.25px;
          color: #e8e2d4;" data-xt-bind="text=location">St. Ren Hospital Grounds</span>
    <div id="location-line" style="width: 390px; height: 1.5px; margin-top: 4.5px; margin-bottom: 6px; background-color: #ffffff33;"></div>
    <span id="location-clock" style="height: 30px; line-height: 30px; white-space: nowrap; font-size: 19.5px; letter-spacing: 3px;
          color: #bdb6a8;" data-xt-bind="text=clock">17:42</span>
  </div>

  <div id="interact-prompt" style="position: absolute; left: 1641px; top: 58.33%; height: 48px;
       display: flex; flex-direction: row; align-items: center; gap: 15px;
       padding-top: 6px; padding-right: 18px; padding-bottom: 6px; padding-left: 6px; background-color: #00000073;"
       data-xt-bind="class.gone=interact_visible | not"
       data-xt-timeline="intro: 0 opacity 0, 400 opacity 0, 900 ease-out opacity 1">
    <span id="interact-key" style="width: 36px; height: 36px; line-height: 33px; text-align: center; font-size: 19.5px; color: #f6f1e6;
          border: 1.5px solid #e8e2d4; border-radius: 4.5px;">E</span>
    <span id="interact-label" style="white-space: nowrap; font-size: 22.5px; letter-spacing: 2.25px; color: #f6f1e6;"
          data-xt-bind="text=interact_label">Open Gate</span>
  </div>

  <div id="vitals" style="position: absolute; left: 90px; top: 894px; width: 450px; height: 159px;
       display: flex; flex-direction: column; gap: 3px;"
       data-xt-timeline="intro: 0 opacity 0, 300 opacity 0, 1100 ease-out opacity 1">
    <div id="vital-health" class="vital">
      <svg id="health-icon" class="vital-icon" viewBox="0 0 30 30">
        <path id="Pulse" d="M2 15 L9 15 L11.5 9 L15 22 L18 11 L20.5 15 L28 15" fill="none" stroke="#e8e2d4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="health-label" class="vital-label">Health</span>
      <div id="health-track" class="bar-track">
        <div id="health-fill" class="bar-fill" style="width: 64%;" data-xt-bind="width=hp | range(0,100,0%,100%)"></div>
      </div>
    </div>
    <div id="vital-stamina" class="vital">
      <svg id="stamina-icon" class="vital-icon" viewBox="0 0 30 30">
        <circle id="Head" cx="18.5" cy="5" r="2.4" fill="none" stroke="#e8e2d4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="Body" d="M17 9.5 L13.5 16.5 L18 20 L16.5 27" fill="none" stroke="#e8e2d4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="Arm" d="M9.5 13 L14 9.5 L19 12 L22.5 15" fill="none" stroke="#e8e2d4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="Leg" d="M13.5 16.5 L10.5 21.5 L5.5 22.5" fill="none" stroke="#e8e2d4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="stamina-label" class="vital-label">Stamina</span>
      <div id="stamina-track" class="bar-track">
        <div id="stamina-fill" class="bar-fill" style="width: 78%;" data-xt-bind="width=stamina | range(0,100,0%,100%)"></div>
      </div>
    </div>
    <div id="vital-noise" class="vital">
      <svg id="noise-icon" class="vital-icon" viewBox="0 0 30 30">
        <rect id="Capsule" x="11" y="3" width="8" height="14" rx="4" fill="none" stroke="#e8e2d4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="Cradle" d="M7.5 13.5 C7.5 18 10.5 21 15 21 C19.5 21 22.5 18 22.5 13.5" fill="none" stroke="#e8e2d4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="Stem" d="M15 21 L15 26" fill="none" stroke="#e8e2d4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="Base" d="M10.5 26 L19.5 26" fill="none" stroke="#e8e2d4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="noise-label" class="vital-label">Noise</span>
      <svg id="noise-wave" viewBox="0 0 180 30" style="position: absolute; left: 168px; top: 10.5px; width: 180px; height: 30px;">
        <path id="Wave" d="M0 15 L4 15 L6 10 L8 20 L10 6 L12 24 L14 9 L16 19 L18 12 L20 17 L22 4 L24 26 L26 11 L28 18 L30 14 L32 16 L34 13 L36 15 L45 15"
              fill="none" stroke="#8fbf8a" stroke-width="1.5" stroke-linejoin="round"/>
        <path id="Rest" d="M48 15 L180 15" fill="none" stroke="#ffffff40" stroke-width="1.5" stroke-dasharray="1.5 4.5"/>
      </svg>
      <span id="noise-value" style="position: absolute; left: 366px; top: 0px; width: 84px; height: 51px; line-height: 51px;
            white-space: nowrap; font-size: 19.5px; letter-spacing: 1.5px; color: #8fbf8a;" data-xt-bind="text=noise_label">Low</span>
    </div>
  </div>

  <div id="inventory" style="position: absolute; left: 1335px; top: 915px; width: 489px; height: 105px;
       display: flex; flex-direction: row; gap: 39px;"
       data-xt-timeline="intro: 0 opacity 0, 500 opacity 0, 1200 ease-out opacity 1">
    <div id="slot-1" class="slot active">
      <span id="slot-1-badge" class="slot-badge">1</span>
      <svg id="slot-1-icon" class="slot-icon" viewBox="0 0 54 54">
          <path id="Body" d="M12 40 L30 22 L36 28 L18 46 Z" fill="#bdb6a8"/>
          <path id="Head" d="M30 22 L37 15 L43 21 L36 28 Z" fill="#e8e2d4"/>
          <path id="Switch" d="M20 34 L23 31 L25 33 L22 36 Z" fill="#a39e93"/>
      </svg>
      <span id="slot-1-caption" class="slot-caption">Flashlight</span>
    </div>
    <div id="slot-2" class="slot">
      <span id="slot-2-badge" class="slot-badge">2</span>
      <svg id="slot-2-icon" class="slot-icon" viewBox="0 0 54 54">
          <path id="Bar" d="M15 45 L35 14 C37.5 10 42.5 10 44 14" fill="none" stroke="#d6d0c2" stroke-width="3.6" stroke-linecap="round"/>
      </svg>
      <span id="slot-2-caption" class="slot-caption">Crowbar</span>
    </div>
    <div id="slot-3" class="slot">
      <span id="slot-3-badge" class="slot-badge">3</span>
      <svg id="slot-3-icon" class="slot-icon" viewBox="0 0 54 54">
          <rect id="Board" x="15" y="11" width="24" height="34" rx="2" fill="#a39e93"/>
          <rect id="Clip" x="21" y="7.5" width="12" height="6" rx="1.5" fill="#e8e2d4"/>
          <rect id="Line1" x="19.5" y="20" width="15" height="2" fill="#e8e2d4"/>
          <rect id="Line2" x="19.5" y="26" width="15" height="2" fill="#e8e2d4"/>
          <rect id="Line3" x="19.5" y="32" width="10" height="2" fill="#e8e2d4"/>
      </svg>
      <span id="slot-3-caption" class="slot-caption">Clipboard</span>
    </div>
    <div id="slot-4" class="slot">
      <span id="slot-4-badge" class="slot-badge">4</span>
      <svg id="slot-4-icon" class="slot-icon" viewBox="0 0 54 54">
          <circle id="Bow" cx="18" cy="21" r="7.5" fill="none" stroke="#e8e2d4" stroke-width="3"/>
          <path id="Shaft" d="M23.5 26.5 L42 45" fill="none" stroke="#e8e2d4" stroke-width="3" stroke-linecap="round"/>
          <path id="Tooth1" d="M35.5 38.5 L39.5 34.5" fill="none" stroke="#e8e2d4" stroke-width="3" stroke-linecap="round"/>
          <path id="Tooth2" d="M39.5 42.5 L43.5 38.5" fill="none" stroke="#e8e2d4" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span id="slot-4-caption" class="slot-caption">East Wing Key</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script></body></html>
